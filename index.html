<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반야원 banyaonegame</title>
<meta name="description" content="1인 인디 게임 스튜디오 반야원(banyaonegame)의 공식 페이지입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213D;
    --ink-deep: #0E172C;
    --gold: #E0B44C;
    --text: #EDEFF5;
    --muted: #9AA3BF;
    --line: #2A3657;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  a { color: var(--gold); text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 2px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }

  /* 히어로: 원상(圓相) 위에 스튜디오 이름 */
  .hero {
    min-height: 78vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 64px 0 48px;
  }
  .enso { position: relative; width: min(340px, 78vw); aspect-ratio: 1; display: grid; place-items: center; }
  .enso svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .enso circle {
    fill: none; stroke: var(--gold); stroke-width: 6;
    stroke-dasharray: 566; stroke-dashoffset: 566;
    animation: draw 2.2s cubic-bezier(.6,.1,.3,1) .2s forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .enso circle { animation: none; stroke-dashoffset: 0; } }
  .name {
    position: relative;
    font-family: "Gowun Batang", "Nanum Myeongjo", serif;
    font-weight: 700;
    font-size: clamp(40px, 10vw, 64px);
    letter-spacing: .04em;
    line-height: 1.1;
    margin: 0;
  }
  .name small {
    display: block;
    font-family: "Noto Sans KR", sans-serif;
    font-weight: 400;
    font-size: 15px;
    letter-spacing: .04em;
    color: var(--muted);
    margin-top: 10px;
  }
  .tagline { color: var(--muted); margin: 28px 0 0; font-size: 17px; }

  section { padding: 56px 0; border-top: 1px solid var(--line); }
  h2 {
    font-family: "Gowun Batang", serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 20px;
  }

  .game {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    background: var(--ink-deep);
    border-left: 3px solid var(--gold);
    padding: 24px;
  }
  .game h3 { font-family: "Gowun Batang", serif; font-size: 22px; margin: 0; }
  .game .en { color: var(--muted); font-size: 14px; margin: 0; }
  .game p { margin: 8px 0 0; }
  .play {
    justify-self: start;
    margin-top: 16px;
    display: inline-block;
    padding: 12px 20px;
    background: var(--gold);
    color: var(--ink-deep);
    font-weight: 700;
    text-decoration: none;
    border-radius: 6px;
  }
  .play:hover { background: #F0C863; }

  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 12px 24px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 480px) {
    dl { grid-template-columns: 1fr; gap: 2px; }
    dd { margin-bottom: 14px; }
  }

  footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<header class="hero">
  <div>
    <div class="enso">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="90" transform="rotate(-90 100 100)"/>
      </svg>
      <h1 class="name">반야원<small>banyaonegame</small></h1>
    </div>
    <p class="tagline">혼자서, 오래 즐길 수 있는 게임을 만듭니다.</p>
  </div>
</header>

<main class="wrap">
  <section aria-labelledby="games">
    <h2 id="games">게임</h2>
    <article class="game">
      <h3>회귀자의 유산</h3>
      <p class="en">Legacy of the Regressor</p>
      <p>죽음과 회귀를 거듭하며 영웅을 모으고 키워 나가는 방치형 RPG입니다.</p>
      <a class="play" href="https://play.google.com/store/apps/details?id=com.banyaonegame.legacy">Google Play에서 받기</a>
    </article>
  </section>

  <section aria-labelledby="support">
    <h2 id="support">지원</h2>
    <dl>
      <dt>문의</dt>
      <dd><a href="mailto:banyaonegame@gmail.com">banyaonegame@gmail.com</a></dd>
      <dt>계정 삭제</dt>
      <dd><a href="delete-account.html">계정 및 데이터 삭제 안내</a></dd>
      <dt>개인정보처리방침</dt>
      <dd><a href="privacy-legacy.html">회귀자의 유산 개인정보처리방침</a></dd>
    </dl>
  </section>
</main>

<footer>
  <div class="wrap">© 2026 반야원. All rights reserved.</div>
</footer>

</body>
</html>
